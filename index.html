<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patidar Lucky Seat</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#fffaf3,#eef7ff);
    color:#123f6b;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:25px 18px 40px;
    text-align:center;
}

.brand{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
}

h1{
    margin:0;
    font-size:36px;
}

.subtitle{
    color:#555;
    font-size:17px;
    line-height:1.5;
    margin:10px 0 25px;
}


/* SEAT SELECTION */

.seat-box{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
    margin-bottom:25px;
}

.seat-box h2{
    margin-top:0;
    font-size:21px;
}

select{
    width:100%;
    padding:14px;
    font-size:18px;
    border:2px solid #1565a8;
    border-radius:10px;
    background:white;
    margin-top:5px;
}

.continue-btn{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    margin-top:15px;
    font-size:17px;
    font-weight:bold;
    color:white;
    background:#f57c00;
    cursor:pointer;
}


/* SCRATCH AREA */

#gameArea{
    display:none;
}

.selected-seat{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}

.scratch-wrapper{
    position:relative;
    width:100%;
    height:300px;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 35px rgba(0,0,0,.18);
    background:white;
}

.result{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:25px;
    background:white;
}

.result-icon{
    font-size:55px;
    margin-bottom:5px;
}

.result h2{
    margin:5px 0 10px;
    font-size:27px;
}

.result p{
    margin:5px 0;
    font-size:17px;
    line-height:1.45;
}

.winner{
    color:#ef6c00;
}

.loser{
    color:#1565a8;
}

.discount{
    font-size:32px !important;
    font-weight:900;
    color:#ef6c00;
}

.verify{
    margin-top:13px !important;
    font-size:13px !important;
    color:#666;
}


/* CANVAS */

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    cursor:pointer;
    touch-action:none;
}

.scratch-text{
    margin-top:20px;
    font-size:21px;
    font-weight:bold;
}

.small{
    color:#666;
    font-size:14px;
    margin-top:7px;
}


/* MOBILE */

@media(max-width:480px){

    .container{
        padding-top:20px;
    }

    h1{
        font-size:31px;
    }

    .scratch-wrapper{
        height:280px;
    }
}
</style>
</head>


<body>

<div class="container">

    <div class="brand">
        🚌 PATIDAR TOURS & TRAVELS
    </div>

    <h1>🍀 Lucky Seat</h1>

    <div class="subtitle">
        Aaj kismat aapke saath hai?<br>
        Apni seat select karke scratch kijiye! 🎁
    </div>


    <!-- SEAT SELECTION -->

    <div class="seat-box" id="seatBox">

        <h2>🎫 Select Your Seat Number</h2>

        <select id="seatSelect">
            <option value="">-- Choose Your Seat --</option>
        </select>
<div style="margin-top:18px; text-align:left;">

    <label for="passengerName"><b>👤 Passenger Name</b></label>
    <input
        type="text"
        id="passengerName"
        placeholder="Enter your name"
        required
        style="width:100%; padding:14px; margin-top:6px; margin-bottom:15px;
        font-size:16px; border:2px solid #1565a8; border-radius:10px;"
    >

    <label for="mobileNumber"><b>📱 Mobile Number</b></label>
    <input
        type="tel"
        id="mobileNumber"
        placeholder="Enter 10 digit mobile number"
        maxlength="10"
        inputmode="numeric"
        required
        style="width:100%; padding:14px; margin-top:6px;
        font-size:16px; border:2px solid #1565a8; border-radius:10px;"
    >

</div>
        <button class="continue-btn" onclick="submitPassengerData()">
    Get Your Scratch Card 🎁
</button>

    </div>


    <!-- SCRATCH GAME -->

    <div id="gameArea">

        <div class="selected-seat">
            🎫 Your Seat: <span id="displaySeat"></span>
        </div>

        <div class="scratch-wrapper">

            <div class="result" id="result"></div>

            <canvas id="scratchCanvas"></canvas>

        </div>

        <div class="scratch-text">
            👆 Scratch Here
        </div>

        <div class="small">
            Use your finger to scratch the card
        </div>

    </div>

</div>


<script>
const SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPa65lJwIrm06nA1Egi23fTiOw15fePBLlhkHY67nPVcqnFiXXKgF8hLTj6h0CP2_F-g/exec";
/* ==================================================
   🔐 DAILY LUCKY SEATS

   DAILY SIRF YE 2 NUMBERS CHANGE KARNE HAIN.

   Example:
   const luckySeats = [12, 28];

================================================== */

const luckySeats = [3, 7];


/* CREATE SEATS 1 TO 45 */

const seatSelect = document.getElementById("seatSelect");

for(let i = 1; i <= 45; i++){

    const option = document.createElement("option");

    option.value = i;
    option.textContent = "Seat " + i;

    seatSelect.appendChild(option);
}

async function submitPassengerData() {

    const seat = document.getElementById("seatSelect").value;
    const name = document.getElementById("passengerName").value.trim();
    const mobile = document.getElementById("mobileNumber").value.trim();

    if (!seat) {
        alert("Please select your actual seat number.");
        return;
    }

    if (!name) {
        alert("Please enter your name.");
        return;
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
        alert("Please enter a valid 10 digit mobile number.");
        return;
    }

    try {

        startGame();

    } catch (error) {

        alert("Something went wrong. Please try again.");

    }
}
/* START GAME */

function startGame(){

    const seat = parseInt(seatSelect.value);

    if(!seat){

        alert("Please select your actual seat number.");

        return;
    }

    document.getElementById("seatBox").style.display = "none";

    document.getElementById("gameArea").style.display = "block";

    document.getElementById("displaySeat").textContent = seat;

    createResult(seat);

    setupScratch();
}


/* CREATE RESULT */

function createResult(seat){

    const result = document.getElementById("result");

    if(luckySeats.includes(seat)){

        result.innerHTML = `

        <div class="result-icon">🎉</div>

        <h2 class="winner">
            CONGRATULATIONS!
        </h2>

        <p>
            Your seat is today's
            <strong>Lucky Seat!</strong>
        </p>

        <p class="discount">
            🎁 50% OFF
        </p>

        <p>
            Enjoy your lucky journey with<br>
            Patidar Tours & Travels 🚌
        </p>

        <p class="verify">
            *Offer valid only for the selected seat number.
            Please show this screen and your ticket to the conductor.
        </p>

        `;

    }else{

        result.innerHTML = `

        <div class="result-icon">🍀</div>

        <h2 class="loser">
            BETTER LUCK NEXT TIME!
        </h2>

        <p>
            Aaj kismat thodi aur door hai 😊
        </p>

        <p>
            Keep travelling with<br>
            <strong>Patidar Tours & Travels</strong>
        </p>

        <p>
            🚌 Have a Safe & Pleasant Journey!
        </p>

        `;
    }  

    const passengerName = document.getElementById("passengerName").value.trim();
const mobileNumber = document.getElementById("mobileNumber").value.trim();

const resultStatus = luckySeats.includes(seat) ? "WIN - 50% OFF" : "LOSE";

fetch(SHEET_WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        name: passengerName,
        mobile: mobileNumber,
        seat: seat,
        result: resultStatus
    })
});
}


/* SCRATCH CARD */

function setupScratch(){

    const canvas = document.getElementById("scratchCanvas");

    const wrapper = canvas.parentElement;

    const rect = wrapper.getBoundingClientRect();

    const dpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    const ctx = canvas.getContext("2d");

    ctx.scale(dpr,dpr);


    /* Scratch Cover */

    const gradient = ctx.createLinearGradient(
        0,
        0,
        rect.width,
        rect.height
    );

    gradient.addColorStop(0,"#07599a");
    gradient.addColorStop(.55,"#1679ba");
    gradient.addColorStop(1,"#f57c00");

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        0,
        rect.width,
        rect.height
    );


    /* Cover Text */

    ctx.fillStyle = "white";

    ctx.textAlign = "center";

    ctx.font = "bold 28px Arial";

    ctx.fillText(
        "🎁 SCRATCH HERE",
        rect.width / 2,
        rect.height / 2
    );

    ctx.font = "16px Arial";

    ctx.fillText(
        "Reveal Your Luck",
        rect.width / 2,
        rect.height / 2 + 35
    );


    let scratching = false;


    function scratch(x,y){

        ctx.globalCompositeOperation = "destination-out";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            28,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    function position(e){

        const r = canvas.getBoundingClientRect();

        const point = e.touches ? e.touches[0] : e;

        return {
            x:point.clientX-r.left,
            y:point.clientY-r.top
        };
    }


    canvas.addEventListener("mousedown",()=>scratching=true);

    canvas.addEventListener("mouseup",()=>scratching=false);

    canvas.addEventListener("mouseleave",()=>scratching=false);


    canvas.addEventListener("mousemove",(e)=>{

        if(!scratching) return;

        const p=position(e);

        scratch(p.x,p.y);
    });


    canvas.addEventListener("touchstart",(e)=>{

        e.preventDefault();

        scratching=true;

        const p=position(e);

        scratch(p.x,p.y);

    },{passive:false});


    canvas.addEventListener("touchmove",(e)=>{

        e.preventDefault();

        if(!scratching) return;

        const p=position(e);

        scratch(p.x,p.y);

    },{passive:false});


    canvas.addEventListener("touchend",()=>scratching=false);

}

</script>

</body>
</html>
